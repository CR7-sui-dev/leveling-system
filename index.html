<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leveling System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Leveling System</h1>
      <p class="subtitle">Track XP, complete tasks, and level up — no newsletter, no ads.</p>
    </header>

    <section class="panel summary" aria-labelledby="progress-heading">
      <div class="level-info">
        <div class="level-badge" id="level-badge">1</div>
        <div class="level-text">
          <div id="xp-text">0 XP</div>
          <div class="next-level" id="next-level-text">Next: 100 XP</div>
        </div>
      </div>

      <div class="progress-wrap" aria-hidden="false">
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <div class="controls">
        <div class="add-xp">
          <input id="xp-input" type="number" min="1" placeholder="+ XP" aria-label="Add XP amount">
          <button id="add-xp-btn">Add XP</button>
        </div>
        <div class="quick-xp">
          <button class="chip" data-xp="5">+5</button>
          <button class="chip" data-xp="10">+10</button>
          <button class="chip" data-xp="25">+25</button>
        </div>
      </div>

      <div class="storage-actions">
        <button id="export-btn">Export JSON</button>
        <button id="import-btn">Import JSON</button>
        <input type="file" id="import-file" accept="application/json" style="display:none">
        <button id="reset-btn" title="Reset all data">Reset</button>
      </div>
    </section>

    <section class="panel tasks" aria-labelledby="tasks-heading">
      <div class="panel-header">
        <h2 id="tasks-heading">Tasks</h2>
        <div class="add-task">
          <input id="task-title" placeholder="New task title" aria-label="New task title">
          <input id="task-xp" type="number" min="0" value="10" aria-label="XP for task">
          <button id="add-task-btn">Add</button>
        </div>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p class="hint">Complete tasks to earn their XP. You can edit/delete tasks.</p>
    </section>

    <footer class="footer">
      <small>Built from a Notion template concept — newsletter/ad removed. Data stored locally.</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
